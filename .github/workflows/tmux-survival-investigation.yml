# Experiment phase 2: Can tmux escape the Job Object?
#
# Phase 1 confirmed: step timeout-minutes terminates tmux because it
# stays in the runner's Job Object.  Phase 2 tests escape mechanisms.
#
# Each job starts tmux/upterm via a different launch method, then
# subjects it to a 1-minute timeout.  The WMI watchdog (proven to
# survive timeouts) records whether tmux survived.

name: "Investigate: what kills tmux on Windows?"

on:
  push:
    branches:
      - tmux-survival-investigation

env:
  UPTERM_DATA: C:\Users\runneradmin\AppData\Local\Temp\upterm-data

jobs:

  # ── Diagnostic: Query Job Object flags ──────────────────────────
  job-object-flags:
    name: "Diag: Job Object flags"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Job Object flags
        shell: pwsh
        run: |
          $evidence = Join-Path $PWD 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class JobObjectInfo {
              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool IsProcessInJob(IntPtr hProcess, IntPtr hJob, out bool result);

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool QueryInformationJobObject(
                  IntPtr hJob, int infoClass, ref JOBOBJECT_BASIC_LIMIT_INFORMATION info,
                  int cbSize, IntPtr lpReturnLength);

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern bool QueryInformationJobObject(
                  IntPtr hJob, int infoClass, ref JOBOBJECT_EXTENDED_LIMIT_INFORMATION info,
                  int cbSize, IntPtr lpReturnLength);

              [StructLayout(LayoutKind.Sequential)]
              public struct IO_COUNTERS {
                  public ulong ReadOperationCount, WriteOperationCount, OtherOperationCount;
                  public ulong ReadTransferCount, WriteTransferCount, OtherTransferCount;
              }

              [StructLayout(LayoutKind.Sequential)]
              public struct JOBOBJECT_BASIC_LIMIT_INFORMATION {
                  public long PerProcessUserTimeLimit;
                  public long PerJobUserTimeLimit;
                  public uint LimitFlags;
                  public UIntPtr MinimumWorkingSetSize;
                  public UIntPtr MaximumWorkingSetSize;
                  public uint ActiveProcessLimit;
                  public UIntPtr Affinity;
                  public uint PriorityClass;
                  public uint SchedulingClass;
              }

              [StructLayout(LayoutKind.Sequential)]
              public struct JOBOBJECT_EXTENDED_LIMIT_INFORMATION {
                  public JOBOBJECT_BASIC_LIMIT_INFORMATION BasicLimitInformation;
                  public IO_COUNTERS IoInfo;
                  public UIntPtr ProcessMemoryLimit;
                  public UIntPtr JobMemoryLimit;
                  public UIntPtr PeakProcessMemoryUsed;
                  public UIntPtr PeakJobMemoryUsed;
              }

              public static string GetFlags() {
                  bool isInJob;
                  IsProcessInJob(System.Diagnostics.Process.GetCurrentProcess().Handle, IntPtr.Zero, out isInJob);
                  if (!isInJob) return "NOT in a Job Object";

                  var info = new JOBOBJECT_BASIC_LIMIT_INFORMATION();
                  bool ok = QueryInformationJobObject(IntPtr.Zero, 2, ref info,
                      Marshal.SizeOf(info), IntPtr.Zero);
                  if (!ok) return "In Job Object but QueryInformationJobObject failed: " +
                      Marshal.GetLastWin32Error();

                  uint flags = info.LimitFlags;
                  string result = "LimitFlags = 0x" + flags.ToString("X8") + "\n";
                  // Key flags
                  if ((flags & 0x00000800) != 0) result += "  JOB_OBJECT_LIMIT_BREAKAWAY_OK\n";
                  if ((flags & 0x00001000) != 0) result += "  JOB_OBJECT_LIMIT_SILENT_BREAKAWAY_OK\n";
                  if ((flags & 0x00002000) != 0) result += "  JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE\n";
                  if ((flags & 0x00000001) != 0) result += "  JOB_OBJECT_LIMIT_WORKINGSET\n";
                  if ((flags & 0x00000002) != 0) result += "  JOB_OBJECT_LIMIT_PROCESS_TIME\n";
                  if ((flags & 0x00000004) != 0) result += "  JOB_OBJECT_LIMIT_JOB_TIME\n";
                  if ((flags & 0x00000008) != 0) result += "  JOB_OBJECT_LIMIT_ACTIVE_PROCESS\n";
                  if ((flags & 0x00000010) != 0) result += "  JOB_OBJECT_LIMIT_AFFINITY\n";
                  if ((flags & 0x00000020) != 0) result += "  JOB_OBJECT_LIMIT_PRIORITY_CLASS\n";
                  if ((flags & 0x00000040) != 0) result += "  JOB_OBJECT_LIMIT_PRESERVE_JOB_TIME\n";
                  if ((flags & 0x00000080) != 0) result += "  JOB_OBJECT_LIMIT_SCHEDULING_CLASS\n";
                  if ((flags & 0x00000100) != 0) result += "  JOB_OBJECT_LIMIT_PROCESS_MEMORY\n";
                  if ((flags & 0x00000200) != 0) result += "  JOB_OBJECT_LIMIT_JOB_MEMORY\n";
                  if ((flags & 0x00000400) != 0) result += "  JOB_OBJECT_LIMIT_DIE_ON_UNHANDLED_EXCEPTION\n";
                  return result;
              }
          }
          "@

          $result = [JobObjectInfo]::GetFlags()
          Write-Host $result
          $result | Out-File "$evidence/job-object-flags.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-job-object-flags
          path: evidence/

  # ── E1: Baseline (direct tmux, timeout) ────────────────────────
  direct-tmux:
    name: "E1: direct tmux (control, expect FAIL)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps and start tmux/upterm session
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
          MSYSTEM: MINGW64
        run: source experiments/tmux-survival/setup.sh
      - name: Start watchdog
        shell: pwsh
        run: . experiments/tmux-survival/start-watchdog.ps1
      - name: Timeout treatment (1 min)
        timeout-minutes: 1
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { MSYS2_PATH_TYPE: inherit, CHERE_INVOKING: 1, MSYSTEM: MINGW64 }
        run: sleep 3600
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: . experiments/tmux-survival/collect.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-direct-tmux
          path: evidence/

  # ── E2: WMI-spawned tmux ────────────────────────────────────────
  wmi-spawn:
    name: "E2: WMI-spawned tmux"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (no session start)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
          MSYSTEM: MINGW64
        run: source experiments/tmux-survival/setup-deps-only.sh
      - name: Start tmux via WMI and start watchdog
        shell: pwsh
        run: |
          . experiments/tmux-survival/start-via-wmi.ps1
          . experiments/tmux-survival/start-watchdog.ps1
      - name: Timeout treatment (1 min)
        timeout-minutes: 1
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { MSYS2_PATH_TYPE: inherit, CHERE_INVOKING: 1, MSYSTEM: MINGW64 }
        run: sleep 3600
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: . experiments/tmux-survival/collect.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-wmi-spawn
          path: evidence/

  # ── E3: Scheduled task ──────────────────────────────────────────
  schtasks-spawn:
    name: "E3: schtasks-spawned tmux"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (no session start)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
          MSYSTEM: MINGW64
        run: source experiments/tmux-survival/setup-deps-only.sh
      - name: Start tmux via schtasks and start watchdog
        shell: pwsh
        run: |
          . experiments/tmux-survival/start-via-schtasks.ps1
          . experiments/tmux-survival/start-watchdog.ps1
      - name: Timeout treatment (1 min)
        timeout-minutes: 1
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { MSYS2_PATH_TYPE: inherit, CHERE_INVOKING: 1, MSYSTEM: MINGW64 }
        run: sleep 3600
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: . experiments/tmux-survival/collect.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-schtasks-spawn
          path: evidence/

  # ── E4: CREATE_BREAKAWAY_FROM_JOB forced ────────────────────────
  breakaway-flag:
    name: "E4: forced CREATE_BREAKAWAY_FROM_JOB"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (no session start)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
          MSYSTEM: MINGW64
        run: source experiments/tmux-survival/setup-deps-only.sh
      - name: Start tmux with breakaway flag and start watchdog
        shell: pwsh
        run: |
          . experiments/tmux-survival/start-via-breakaway.ps1
          . experiments/tmux-survival/start-watchdog.ps1
      - name: Timeout treatment (1 min)
        timeout-minutes: 1
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { MSYS2_PATH_TYPE: inherit, CHERE_INVOKING: 1, MSYSTEM: MINGW64 }
        run: sleep 3600
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: . experiments/tmux-survival/collect.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-breakaway-flag
          path: evidence/

  # ── E5: Windows Service wrapper ─────────────────────────────────
  nssm-service:
    name: "E5: NSSM service wrapper"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (no session start)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
          MSYSTEM: MINGW64
        run: source experiments/tmux-survival/setup-deps-only.sh
      - name: Start tmux via NSSM service and start watchdog
        shell: pwsh
        run: |
          . experiments/tmux-survival/start-via-nssm.ps1
          . experiments/tmux-survival/start-watchdog.ps1
      - name: Timeout treatment (1 min)
        timeout-minutes: 1
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env: { MSYS2_PATH_TYPE: inherit, CHERE_INVOKING: 1, MSYSTEM: MINGW64 }
        run: sleep 3600
      - name: Collect evidence
        if: always()
        shell: pwsh
        run: . experiments/tmux-survival/collect.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-nssm-service
          path: evidence/
